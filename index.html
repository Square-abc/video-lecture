<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>视频讲台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
:root{
  --bg:#1a1a1a;--stage:#000;--panel:rgba(45,45,45,.92);--panel-2:rgba(56,56,56,.95);
  --line:rgba(255,255,255,.08);--txt:#e8e8e8;--txt2:#9a9a9a;--txt3:#6a6a6a;
  --accent:#0088ff;--danger:#ff4757;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);
  height:100vh;height:100dvh;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  position:relative;
}
.stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--stage);overflow:hidden;
}
.stagewrap{
  position:relative;overflow:hidden;background:#000;
  transform-origin:center center;will-change:transform;
  touch-action:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.3);
}
.stagewrap > canvas,.stagewrap > video{
  position:absolute;top:0;left:0;display:block;width:100%;height:100%;
}
#cam{display:none}
#frame{transition:filter .18s ease}
#ink{z-index:5;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}

.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:fa .42s ease-out forwards}
@keyframes fa{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}

.hint{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px;text-align:center;
  color:var(--txt3);font-size:12px;
}
.hint.hide{display:none}
.hint > i{font-size:42px;opacity:.3}
.hint p{line-height:1.6}
.hint .tip{
  max-width:420px;line-height:1.7;font-size:11px;
  padding:10px 14px;border-radius:12px;
  background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.25);
  color:#eab308;text-align:left;pointer-events:auto;
}
.hint .tip code{
  background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--accent);
}
.stage-float{
  position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;
  z-index:30;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  pointer-events:none;
}
.stage-float > *{pointer-events:auto}
.float-pill{
  font-size:10px;padding:4px 10px;border-radius:20px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;font-weight:500;letter-spacing:.2px;
  display:inline-flex;align-items:center;gap:5px;
  white-space:nowrap;
}
.float-pill i{font-size:10px}
.float-pill.status.ok{background:rgba(0,136,255,.85);color:#fff}
.float-pill.status.ok i{color:#fff}
.float-pill.status.warn{background:rgba(234,179,8,.9);color:#1a1a1a}
.float-pill.status.warn i{color:#1a1a1a}
.float-pill.status.err{background:rgba(255,71,87,.9);color:#fff}
.float-pill.status.err i{color:#fff}
.float-pill.frozen i{color:#7ec8ff}
.float-pill.blackboard{background:rgba(0,136,255,.9);color:#fff}
.float-pill.blackboard i{color:#fff}
.float-pill.hidden{display:none}

.erase-tip{
  position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;
  transform:translateX(-50%);
  z-index:30;
  font-size:11px;padding:6px 14px;border-radius:20px;
  background:rgba(255,71,87,.9);color:#fff;
  font-weight:500;letter-spacing:.2px;
  display:none;align-items:center;gap:6px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.erase-tip.show{display:inline-flex}
.erase-tip i{font-size:11px}

.zoom-pill{
  position:absolute;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:10px;z-index:30;
  font-size:10px;padding:4px 10px;border-radius:20px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;font-variant-numeric:tabular-nums;cursor:pointer;
  display:none;align-items:center;gap:5px;
}
.zoom-pill.show{display:inline-flex}
.zoom-pill i{font-size:10px;color:var(--accent)}

.toolbar{
  position:fixed;left:0;right:0;bottom:0;
  padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:8px;z-index:100;pointer-events:none;
}
.toolbar > *{pointer-events:auto}

.tb-group-left,
.tb-group-right,
.tb-segment{
  display:flex;align-items:center;gap:2px;
  background:var(--panel);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:12px;padding:4px;
  box-shadow:0 6px 22px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.05);
}
.tb-segment{background:var(--panel-2);flex:0 1 auto}
.tb-group-left{flex:0 0 auto}
.tb-group-right{flex:0 0 auto}

.tb{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-width:48px;height:52px;padding:0 6px;
  border:none;border-radius:9px;background:transparent;
  color:var(--txt2);font-family:inherit;
  cursor:pointer;transition:background .15s,color .15s;
  position:relative;
}
.tb i{font-size:18px;line-height:1}
.tb span{font-size:10px;line-height:1;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.08);color:#fff}
.tb:active{background:rgba(255,255,255,.14);transform:scale(.96)}
.tb.on{color:var(--accent);background:rgba(0,136,255,.18)}
.tb:disabled{opacity:.3;cursor:not-allowed}
.tb:disabled:hover{background:transparent;color:var(--txt2)}

.tb-seg{
  flex:1 1 0;min-width:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:52px;
  border:none;background:transparent;
  color:var(--txt2);font-family:inherit;font-size:10px;
  cursor:pointer;transition:background .15s,color .15s;
  padding:0 6px;border-radius:9px;position:relative;
}
.tb-seg i{font-size:18px;line-height:1}
.tb-seg span{font-size:10px;line-height:1;white-space:nowrap}
.tb-seg:hover{background:rgba(255,255,255,.08);color:#fff}
.tb-seg:active{background:rgba(255,255,255,.14);transform:scale(.96)}
.tb-seg.on{background:var(--accent);color:#fff}
.tb-seg.on:hover{background:#0a92ff}
.tb-seg:disabled{opacity:.3;cursor:not-allowed}
.tb-seg:disabled:hover{background:transparent;color:var(--txt2)}

.iowrap{position:relative;display:inline-flex;line-height:0}
.badge{
  position:absolute;top:-5px;right:-8px;
  min-width:14px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--danger);color:#fff;
  font-size:8.5px;font-weight:700;font-style:normal;
  line-height:14px;text-align:center;display:none;
}
.badge.show{display:block}

.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,10px);
  background:rgba(20,20,20,.95);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);color:#fff;
  font-size:11.5px;line-height:1.5;
  padding:8px 16px;border-radius:9px;
  z-index:900;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:400;
}
.scrim.show{opacity:1;pointer-events:auto}

.side-panel{
  position:fixed;top:50%;right:0;transform:translate(105%,-50%);
  width:min(340px,86vw);max-height:80dvh;
  background:#fff;color:#333;
  border-radius:14px 0 0 14px;z-index:500;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:-8px 0 32px rgba(0,0,0,.35);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.side-panel.open{transform:translate(0,-50%)}
.side-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;border-bottom:1px solid #eee;
}
.side-title{font-size:14px;font-weight:600;color:#222;display:flex;align-items:center;gap:8px}
.side-title i{color:var(--accent);font-size:13px}
.side-close{
  width:28px;height:28px;border:none;border-radius:50%;
  background:#f0f0f0;color:#666;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.side-close:hover{background:#e0e0e0}
.side-body{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 16px 16px;
}
.prow{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f0;
}
.prow:last-child{border-bottom:none}
.prow-label{font-size:13px;color:#555;flex:0 0 auto;min-width:56px}
.prow-ctrl{
  display:flex;align-items:center;gap:6px;flex:1 1 auto;justify-content:flex-end;
}
.pbtn{
  height:32px;min-width:44px;padding:0 12px;
  border:1px solid #e0e0e0;border-radius:7px;
  background:#fff;color:#555;font-family:inherit;font-size:12px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:5px;transition:all .15s;
}
.pbtn:hover{background:#f5f5f5;border-color:#ccc}
.pbtn:active{transform:scale(.96)}
.pbtn i{font-size:13px}
.pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn.on:hover{background:#0a92ff}
.pbtn-icon{min-width:32px;padding:0}
.pbtn.wide{min-width:62px}
.pswitch{display:inline-flex;background:#f0f0f0;border-radius:7px;padding:2px}
.pswitch button{
  min-width:44px;height:26px;padding:0 12px;border:none;
  background:transparent;border-radius:5px;
  font-family:inherit;font-size:12px;color:#666;
  cursor:pointer;transition:all .15s;
}
.pswitch button.on{background:var(--accent);color:#fff;font-weight:500}
.prow.pcol{flex-direction:column;align-items:stretch;gap:10px}
.prow.pcol .prow-label{align-self:flex-start}
.prow.pcol .prow-ctrl{justify-content:flex-start}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{
  width:28px;height:28px;border-radius:50%;
  border:2px solid transparent;padding:0;cursor:pointer;
  transition:transform .15s,box-shadow .15s,border-color .15s;
  position:relative;
}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

input[type=range].light{
  -webkit-appearance:none;appearance:none;
  width:100%;height:4px;border-radius:2px;
  background:#e0e0e0;outline:none;cursor:pointer;
}
input[type=range].light::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;
}
input[type=range].light::-moz-range-thumb{
  width:16px;height:16px;border:none;border-radius:50%;
  background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;
}

.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);
  width:100%;max-width:480px;max-height:80dvh;
  background:#fff;color:#333;
  border-radius:16px 16px 0 0;z-index:500;
  display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 32px rgba(0,0,0,.3);
}
.sheet.open{transform:translate(-50%,0)}
.sheet-handle{
  width:34px;height:4px;border-radius:2px;background:#ddd;
  margin:8px auto 2px;flex:0 0 auto;
}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 10px;
}
.sheet-title{font-size:14px;font-weight:600;color:#222;display:flex;align-items:center;gap:8px}
.sheet-title em{
  font-style:normal;font-size:10.5px;font-weight:500;
  color:var(--accent);background:rgba(0,136,255,.12);
  padding:2px 8px;border-radius:10px;
}
.sheet-close{
  width:28px;height:28px;border:none;border-radius:50%;
  background:#f0f0f0;color:#666;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.sheet-close:hover{background:#e0e0e0}
.sheet-body{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px 16px;
}
.camlist{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.camitem{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:10px;
  background:#f8f8f8;border:1px solid #eee;
  cursor:pointer;transition:all .15s;
}
.camitem:hover{background:#f0f0f0}
.camitem:active{transform:scale(.99)}
.camitem.on{background:rgba(0,136,255,.08);border-color:rgba(0,136,255,.35)}
.camitem .camicon{
  width:36px;height:36px;flex:0 0 auto;border-radius:9px;
  background:#e8e8e8;color:#666;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.camitem.on .camicon{background:rgba(0,136,255,.15);color:var(--accent)}
.camitem .caminfo{flex:1 1 auto;min-width:0}
.camitem .camname{
  font-size:13px;color:#333;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.camitem.on .camname{color:var(--accent)}
.camitem .camtag{font-size:11px;color:#999;margin-top:2px}
.camitem .camcheck{color:var(--accent);font-size:14px;opacity:0}
.camitem.on .camcheck{opacity:1}
.camempty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:44px 20px;color:#999;font-size:12px;text-align:center;
}
.camempty i{font-size:36px;opacity:.3}

/* 摄像头状态指示灯 */
.cam-status{
  width:10px;height:10px;border-radius:50%;
  flex:0 0 auto;
  background:#ccc;
  box-shadow:0 0 0 3px rgba(0,0,0,.04);
  transition:all .2s;
}
.cam-status.ok{
  background:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.18);
  animation:camPulse 2s ease-in-out infinite;
}
.cam-status.err{
  background:var(--danger);
  box-shadow:0 0 0 3px rgba(255,71,87,.18);
}
.cam-status.warn{
  background:#eab308;
  box-shadow:0 0 0 3px rgba(234,179,8,.18);
}
@keyframes camPulse{
  0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  50%{box-shadow:0 0 0 5px rgba(34,197,94,.08)}
}

/* 重连提示小按钮（嵌在摄像头行里） */
.cam-retry{
  display:none;
  align-items:center;gap:5px;
  height:28px;padding:0 12px;border:none;border-radius:7px;
  background:var(--accent);color:#fff;
  font-family:inherit;font-size:11.5px;font-weight:500;
  cursor:pointer;flex:0 0 auto;
  transition:background .15s;
}
.cam-retry:hover{background:#0a92ff}
.cam-retry:active{transform:scale(.96)}
.cam-retry.show{display:inline-flex}
.cam-retry i{font-size:11px}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding-top:4px}
.aitem{
  position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;
  background:#f0f0f0;border:1px solid #eee;
}
.aitem img{display:block;width:100%;height:100%;object-fit:cover;cursor:pointer}
.apick{
  position:absolute;top:5px;right:5px;
  width:22px;height:22px;padding:0;border-radius:50%;
  border:2px solid rgba(255,255,255,.9);
  background:rgba(0,0,0,.4);
  color:transparent;font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.apick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.aempty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:40px 20px;color:#999;font-size:12px;text-align:center;
}
.aempty i{font-size:36px;opacity:.3}
.afoot{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px;border-top:1px solid #eee;
}
.afoot span{font-size:11.5px;color:#888}
.btn-primary{
  height:36px;padding:0 20px;border:none;border-radius:8px;
  background:var(--accent);color:#fff;
  font-family:inherit;font-size:13px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;transition:background .15s;
}
.btn-primary:not(:disabled):active{transform:scale(.96)}
.btn-primary:disabled{background:#e0e0e0;color:#aaa;cursor:not-allowed}

.viewer{
  position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.96);
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.viewer.show{opacity:1;pointer-events:auto}
.vstage{
  flex:1 1 auto;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;min-height:0;
}
.vstage img{
  max-width:94vw;max-height:100%;object-fit:contain;
  transition:transform .12s ease-out;will-change:transform;
  user-select:none;-webkit-user-drag:none;
}
.vcanvas{position:absolute;pointer-events:none;touch-action:none;display:none;z-index:5}
.vcanvas.on{pointer-events:auto;cursor:crosshair;display:block}
.vclose{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;
  width:38px;height:38px;border:none;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;z-index:10;
}
.vclose:hover{background:rgba(255,255,255,.22)}
.vzoom{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;
  font-size:11px;padding:5px 11px;border-radius:20px;
  background:rgba(0,0,0,.6);color:#fff;
  font-variant-numeric:tabular-nums;z-index:10;
}
.vbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(30,30,30,.96);
  border-top:1px solid rgba(255,255,255,.08);
}
.vb{
  flex:1 1 0;max-width:80px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  height:48px;border:none;border-radius:9px;
  background:transparent;color:#bbb;
  font-family:inherit;font-size:10px;cursor:pointer;
  transition:background .15s,color .15s;
}
.vb i{font-size:15px}
.vb:hover{background:rgba(255,255,255,.08);color:#fff}
.vb:active{transform:scale(.94)}
.vb.on{background:rgba(0,136,255,.2);color:#7ec8ff}
.vb.danger:hover{background:rgba(255,71,87,.2);color:#ff6b7a}

.vAnnotBar{
  position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));
  transform:translateX(-50%);
  display:none;align-items:center;gap:7px;
  padding:8px 12px;border-radius:14px;
  background:rgba(30,30,30,.96);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 28px rgba(0,0,0,.5);
  z-index:20;
}
.vAnnotBar.show{display:flex}
.vdot{
  width:26px;height:26px;border-radius:50%;
  border:2px solid transparent;padding:0;cursor:pointer;transition:all .15s;
}
.vdot.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.vSep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 3px}
.vAnnotBar button:not(.vdot){
  width:32px;height:32px;border:none;border-radius:8px;
  background:transparent;color:#bbb;font-size:13px;

<script>
(function(){

const $ = id => document.getElementById(id);

}

function setCamStatus(state, nameText, tagText){
  camStatusDot.className='cam-status'+(state?' '+state:'');
  if(nameText!==undefined) curCamName.textContent=nameText;
  if(tagText!==undefined) curCamTag.textContent=tagText;
  // 未连接 / 错误时显示"重连"按钮
  if(state==='err'){
    camRetryBtn.classList.add('show');
    camChevron.style.display='none';
  }else{
    camRetryBtn.classList.remove('show');
    camChevron.style.display='';
  }
}

function preflight(){
  if(location.protocol==='file:'){
    hint.classList.remove('hide');
    hintText.textContent='无法在本地文件中访问摄像头';
    hintTip.style.display='block';
    hintTip.innerHTML='<b>浏览器安全策略限制</b><br>请用本地服务器打开，例如在该目录执行：<br><code>python -m http.server 8000</code><br>然后访问 <code>http://localhost:8000/文件名.html</code>';
    btnRetry.style.display='none';
    setPill('<i class="fa-solid fa-triangle-exclamation"></i> 需 HTTP 环境','warn');
    setCamStatus('warn','HTTP 环境受限','请用 localhost 打开');
    return false;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    hint.classList.remove('hide');
    hintText.textContent='当前浏览器不支持摄像头调用';
    hintTip.style.display='block';
    hintTip.innerHTML='请使用最新版 Chrome、Edge 或 Safari 浏览器。';
    btnRetry.style.display='none';
    setPill('<i class="fa-solid fa-circle-exclamation"></i> 浏览器不支持','err');
    setCamStatus('err','浏览器不支持','请更换浏览器');
    return false;
  }
  return true;
}
function diagnose(err){
  const n=(err&&err.name)||'UnknownError';
  const m={
    NotAllowedError:'摄像头权限被拒绝。请点击地址栏左侧摄像头图标，选择「允许」后重试。',
    PermissionDeniedError:'摄像头权限被拒绝，请在浏览器设置中允许本站访问摄像头。',
    NotFoundError:'未检测到摄像头设备，请检查设备连接。',
    DevicesNotFoundError:'未检测到摄像头设备，请检查设备连接。',
    NotReadableError:'摄像头被其他程序占用（如会议软件、相机应用），请关闭后重试。',
    TrackStartError:'摄像头被占用或硬件异常，请检查后重试。',
    OverconstrainedError:'摄像头不支持请求的分辨率，请降低画质后重试。',
    SecurityError:'安全策略阻止访问摄像头，请使用 HTTPS 或 localhost 打开。',
    AbortError:'摄像头启动被中断，请重试。'
  };
  return m[n]||('摄像头错误（'+n+'），请重试。');
}
async function listVideoDevices(){
  try{
    const d=await navigator.mediaDevices.enumerateDevices();
    return d.filter(x=>x.kind==='videoinput');
  }catch(e){ console.warn(e); return []; }
}
function isRearCam(label){ return /back|rear|environment|后|後|背面|後置|后置|外|world/i.test(label||''); }
function isFrontCam(label){ return /front|user|face|前|正面|前置|内|自拍/i.test(label||''); }
function updateCamRow(){
  if(!stream){
    setCamStatus('err','未连接','点击右侧「重连」或下方行选择摄像头');
    return;
  }
  const c=availableCams.find(x=>x.deviceId===currentDeviceId);
  const label=(c&&c.label)||'摄像头';
  const isRear=isRearCam(label), isFront=isFrontCam(label);
  const tag = isRear ? '后置摄像头' : isFront ? '前置摄像头' : '可用摄像头';
  setCamStatus('ok', label, tag+' · 使用中');
}
function buildConstraints(deviceId){
  if(deviceId){
    return { video:{ deviceId:{ exact: deviceId }, width:{ideal:1920}, height:{ideal:1080} }, audio:false };
  }
  return { video:{ facingMode:{ ideal:'environment' }, width:{ideal:1920}, height:{ideal:1080} }, audio:false };
}

async function startCamera(){
  if(stream) return;
  if(!preflight()) return;

  hint.classList.remove('hide');
  hintText.textContent='正在请求摄像头…';
  hintTip.style.display='none';
  btnRetry.style.display='none';
  setPill('<i class="fa-solid fa-circle-notch fa-spin"></i> 启动中','warn');
  setCamStatus('warn','启动中…','正在请求摄像头权限');

  const savedId=localStorage.getItem(CAM_KEY)||null;

  try{
    try{
      stream=await navigator.mediaDevices.getUserMedia(buildConstraints(savedId));
    }catch(err){
      if(savedId){
        localStorage.removeItem(CAM_KEY);
        stream=await navigator.mediaDevices.getUserMedia(buildConstraints(null));
      }else{
        throw err;
      }
    }
    video.srcObject=stream;
    await video.play();
    await new Promise(r=>setTimeout(r,140));

    availableCams=await listVideoDevices();
    const track=stream.getVideoTracks()[0];
    const settings=track&&track.getSettings?track.getSettings():{};
    currentDeviceId=settings.deviceId||savedId||(availableCams[0]&&availableCams[0].deviceId)||null;
    if(currentDeviceId) localStorage.setItem(CAM_KEY,currentDeviceId);

    const curLabel=(availableCams.find(c=>c.deviceId===currentDeviceId)||{}).label||'';
    const hasRear=availableCams.some(c=>isRearCam(c.label));
    if(!savedId&&hasRear&&!isRearCam(curLabel)){
      const rear=availableCams.find(c=>isRearCam(c.label));
      if(rear){ await applyDevice(rear.deviceId,true); return; }
    }

    frameC.width=video.videoWidth||1280;
    frameC.height=video.videoHeight||720;

    layoutStage();
    resetTransform();
    frozen=false; frozenFrame=null; badgeFrozen.classList.add('hidden');
    renderLoop();

    setRunning(true);
    hint.classList.add('hide');
    setPill('<i class="fa-solid fa-circle-check"></i> 展示中','ok');
    updateCamRow();
  }catch(err){
    console.error('[Camera]',err);
    stream=null;
    hint.classList.remove('hide');
    hintText.textContent='摄像头不可用';
    hintTip.style.display='block';
    hintTip.innerHTML='<b><i class="fa-solid fa-circle-exclamation"></i> '+
      diagnose(err).replace(/</g,'&lt;')+'</b>';
    btnRetry.style.display='inline-flex';
    setPill('<i class="fa-solid fa-circle-exclamation"></i> 未连接','err');
    setRunning(false);
    // 记录设备列表（部分浏览器在失败后仍能列出设备）
    availableCams = await listVideoDevices();
    setCamStatus('err','摄像头不可用','点击右侧「重连」或下方行选择摄像头');
  }
}

async function applyDevice(deviceId,silent){
  if(switching) return;
  switching=true;
  try{
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }

    stream=await navigator.mediaDevices.getUserMedia(buildConstraints(deviceId));
    video.srcObject=stream;
    await video.play();
    await new Promise(r=>setTimeout(r,120));

    currentDeviceId=deviceId;
    localStorage.setItem(CAM_KEY,deviceId);

    frameC.width=video.videoWidth||1280;
    frameC.height=video.videoHeight||720;

    layoutStage();
    frozen=false; frozenFrame=null; badgeFrozen.classList.add('hidden');
    renderLoop();
    setRunning(true);
    hint.classList.add('hide');
    setPill('<i class="fa-solid fa-circle-check"></i> 展示中','ok');
    updateCamRow();
    if(!silent) toast('已切换摄像头');
  }catch(err){
    console.error('[Switch]',err);
    toast('切换失败：'+diagnose(err),3200);
    if(!stream){
      try{
        stream=await navigator.mediaDevices.getUserMedia(buildConstraints(null));
        video.srcObject=stream; await video.play();
        renderLoop(); setRunning(true);
        hint.classList.add('hide'); setPill('<i class="fa-solid fa-circle-check"></i> 展示中','ok');
        updateCamRow();
      }catch(e){
        setRunning(false);
        setCamStatus('err','摄像头不可用','点击右侧「重连」或下方行选择摄像头');
      }
    }
  }finally{
    switching=false;
  }
}

function stopCamera(){
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null;
  ctxF.clearRect(0,0,frameC.width,frameC.height);
  ctxI.clearRect(0,0,inkC.width,inkC.height);
  strokes=[]; curStroke=null;
  penOn=false; tPen.classList.remove('on'); inkC.classList.remove('on');
  blackboardMode=false; tBlackboard.classList.remove('on'); badgeBB.classList.add('hidden');
  setRotation(0,true);
  resetTransform();
  frozen=false; frozenFrame=null; badgeFrozen.classList.add('hidden');
  tFreeze.classList.remove('on');
  lockSwitch.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.lock==='off'));
  cancelErase();
  hideEraseTip();

  hint.classList.remove('hide');
  hintText.textContent='摄像头已停止';
  hintTip.style.display='none';
  btnRetry.style.display='inline-flex';
  setPill('<i class="fa-solid fa-circle-pause"></i> 已停止','');
  setRunning(false);
  setCamStatus('','已停止','点击右侧「重连」启动');
}

/* ★★★ 核心修改：调节、设置、相册 永不禁用 ★★★ */
function setRunning(on){
  if(on){
    tStop.innerHTML='<i class="fa-solid fa-stop"></i> 停止摄像头';
    tStop.style.background='#666';
    // 摄像头有：启用所有依赖摄像头的按钮
    [tPen,tEraser,tUndo,tSnap,tFreeze,tBlackboard].forEach(b=>b.disabled=false);
    zoomPill.classList.add('show');
  }else{
    tStop.innerHTML='<i class="fa-solid fa-play"></i> 播放摄像头';
    tStop.style.background='var(--accent)';
    // 没摄像头：只禁用真正依赖摄像头的按钮
    [tPen,tEraser,tUndo,tSnap,tFreeze,tBlackboard].forEach(b=>b.disabled=true);
    zoomPill.classList.remove('show');
  }
  // ★ 这几个按钮无论如何都保持可用
  tAdjust.disabled = false;   // 画面调节：让用户能进来查看/调整
  tSet.disabled = false;      // 设置：让用户能进来切换摄像头
  tAlbum.disabled = false;    // 相册：让用户能看历史照片
  tStop.disabled = false;     // 开关：让用户能尝试重新启动
}

async function renderCameraList(){
  camList.innerHTML='';
  availableCams=await listVideoDevices();
  if(availableCams.length&&!availableCams[0].label){
    try{
      const tmp=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
      tmp.getTracks().forEach(t=>t.stop());
      availableCams=await listVideoDevices();
    }catch(e){}
  }
  camCount.textContent=availableCams.length;
  if(!availableCams.length){
    camEmpty.style.display='flex';
    return;
  }
  camEmpty.style.display='none';
  const frag=document.createDocumentFragment();
  availableCams.forEach((c,i)=>{
    const label=c.label||('摄像头 '+(i+1));
    const isCurrent=c.deviceId===currentDeviceId;
    const isRear=isRearCam(label);
    const isFront=isFrontCam(label);
    let tag='摄像头 '+(i+1);
    if(isRear) tag='后置摄像头';
    else if(isFront) tag='前置摄像头';

    const item=document.createElement('div');
    item.className='camitem'+(isCurrent?' on':'');
    item.innerHTML=
      '<div class="camicon"><i class="fa-solid '+(isRear?'fa-camera':'fa-video')+'"></i></div>'+
      '<div class="caminfo">'+
        '<div class="camname">'+label.replace(/</g,'&lt;')+'</div>'+
        '<div class="camtag">'+tag+(isCurrent?' · 使用中':'')+'</div>'+
      '</div>'+
      '<i class="fa-solid fa-check camcheck"></i>';
    item.addEventListener('click',()=>{
      closeAll();
      if(c.deviceId===currentDeviceId && stream){ toast('已是当前摄像头'); return; }
      applyDevice(c.deviceId,false);
    });
    frag.appendChild(item);
  });
  camList.appendChild(frag);
}

if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener){
  navigator.mediaDevices.addEventListener('devicechange',()=>{
    listVideoDevices().then(l=>{ availableCams=l; });
  });
}

/* 点击"重连"按钮：尝试重新启动 */
camRetryBtn.addEventListener('click',(e)=>{

camRow.addEventListener('click',async(e)=>{

function layoutStage(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const fw=frameC.width, fh=frameC.height;
  if(!fw||!fh||sw<=0||sh<=0) return;
  const ar=fw/fh;
  let w=sw, h=sw/ar;
  if(h>sh){ h=sh; w=sh*ar; }
  stageWrap.style.width=Math.round(w)+'px';
  stageWrap.style.height=Math.round(h)+'px';
  resizeInk();
}
function resizeInk(){
  const w=stageWrap.clientWidth, h=stageWrap.clientHeight;
  if(w<1||h<1) return;
  inkC.width=Math.round(w*DPR);
  inkC.height=Math.round(h*DPR);
  ctxI.lineCap='round';
  ctxI.lineJoin='round';
  redrawInk();
}

function applyTransform(){
  stageWrap.style.transform=`translate(${panX}px, ${panY}px) scale(${zoom})`;
  zoomLabel.textContent=Math.round(zoom*100)+'%';
}
function setZoom(z){
  zoom=clamp(z,0.5,5);
  applyTransform();
  redrawFrameFromSource();
}
function resetTransform(){
  panX=0; panY=0; zoom=1;
  applyTransform();
  redrawFrameFromSource();
}

function setRotation(deg,silent){
  rotation=((deg%360)+360)%360;
  strokes=[]; curStroke=null;
  ctxI.clearRect(0,0,inkC.width,inkC.height);
  frozenFrame=null; frozen=false; badgeFrozen.classList.add('hidden');
  tFreeze.classList.remove('on');
  lockSwitch.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.lock==='off'));
  if(stream){
    drawFrame();
    layoutStage();
    if(!silent) toast('画面已旋转 '+rotation+'°');
  }
}
rotLeft.addEventListener('click',()=>{ setRotation(rotation-90); });
rotRight.addEventListener('click',()=>{ setRotation(rotation+90); });

function toggleBlackboard(){
  if(!stream){ toast('请先连接摄像头'); return; }
  blackboardMode=!blackboardMode;
  tBlackboard.classList.toggle('on',blackboardMode);
  badgeBB.classList.toggle('hidden',!blackboardMode);

  if(blackboardMode){
    if(penColor==='#111111'||penColor==='#000000'){
      setPenColor('#ffffff');
    }
    setTool('pen');
    cancelErase();
    toast('虚拟黑板已开启');
  }else{
    toast('已退出虚拟黑板');
  }
  redrawFrameFromSource();
}
tBlackboard.addEventListener('click',toggleBlackboard);

function setPenColor(c){
  penColor=c;
  syncColorUI();
}

function drawFrame(){
  if(!stream) return;
  if(blackboardMode){
    if(!frameC.width||!frameC.height){
      frameC.width=1280; frameC.height=720;
      layoutStage();
    }
    ctxF.save();
    ctxF.setTransform(1,0,0,1,0,0);
    ctxF.fillStyle='#000000';
    ctxF.fillRect(0,0,frameC.width,frameC.height);
    ctxF.restore();
    return;
  }
  let src,sw,sh;
  if(frozen&&frozenFrame){ src=frozenFrame; sw=frozenFrame.width; sh=frozenFrame.height; }
  else{
    if(!video.videoWidth||!video.videoHeight) return;
    src=video; sw=video.videoWidth; sh=video.videoHeight;
  }
  const rot=((rotation%360)+360)%360;
  const swap=(rot===90||rot===270);
  const cw=swap?sh:sw, ch=swap?sw:sh;
  if(frameC.width!==cw||frameC.height!==ch){
    frameC.width=cw; frameC.height=ch;
    layoutStage();
  }
  ctxF.save();
  ctxF.clearRect(0,0,cw,ch);
  ctxF.translate(cw/2,ch/2);
  ctxF.rotate(rot*Math.PI/180);
  ctxF.drawImage(src,-sw/2,-sh/2,sw,sh);
  ctxF.restore();
}
function renderLoop(){ if(!stream) return; drawFrame(); rafId=requestAnimationFrame(renderLoop); }
function redrawFrameFromSource(){ if(stream) drawFrame(); }

function setFrozen(on){
  if(blackboardMode){ toast('黑板模式下不支持冻结'); return; }
  if(!stream){ toast('请先连接摄像头'); return; }
  if(on===frozen) return;
  frozen=on;
  tFreeze.classList.toggle('on', frozen);
  if(frozen){
    if(video.videoWidth&&video.videoHeight){
      frozenFrame=document.createElement('canvas');
      frozenFrame.width=video.videoWidth;
      frozenFrame.height=video.videoHeight;
      frozenFrame.getContext('2d').drawImage(video,0,0);
    }
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    badgeFrozen.classList.remove('hidden');
    toast('画面已冻结');
  }else{
    frozenFrame=null;
    renderLoop();
    badgeFrozen.classList.add('hidden');
    toast('画面已解冻');
  }
}
tFreeze.addEventListener('click',()=>{
  if(!stream){ toast('请先连接摄像头'); return; }
  setFrozen(!frozen);
  lockSwitch.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.lock===(frozen?'on':'off')));
});
lockSwitch.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    const on = b.dataset.lock==='on';
    setFrozen(on);
    lockSwitch.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.lock===(on?'on':'off')));
  });
});

function getPoint(e){
  const t=(e.touches&&e.touches[0])?e.touches[0]:e;
  const r=inkC.getBoundingClientRect();
  if(r.width<1||r.height<1) return {x:0,y:0};
  const sx=inkC.width/r.width, sy=inkC.height/r.height;
  return { x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy };
}
function applyPenStyle(ctx,s){
  ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
  ctx.lineWidth=s.width; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowBlur=s.soft||0; ctx.shadowColor=s.color;
}
function drawStroke(s){
  if(!s.points.length) return;
  applyPenStyle(ctxI,s);
  if(s.points.length===1){
    ctxI.beginPath();
    ctxI.arc(s.points[0].x,s.points[0].y,s.width/2,0,Math.PI*2);
    ctxI.fill();
    return;
  }
  ctxI.beginPath();
  ctxI.moveTo(s.points[0].x,s.points[0].y);
  for(let i=1;i<s.points.length;i++) ctxI.lineTo(s.points[i].x,s.points[i].y);
  ctxI.stroke();
}
function redrawInk(){
  ctxI.clearRect(0,0,inkC.width,inkC.height);
  strokes.forEach(drawStroke);
}
function onDown(e){
  if(!penOn||currentTool!=='pen'||eraseMode) return;
  if(e.touches&&e.touches.length>1){ painting=false; return; }
  e.preventDefault();
  painting=true;
  const p=getPoint(e);
  curStroke={ color:penColor, width:penWidth*(inkC.width/Math.max(1,inkC.clientWidth)), soft:penSoft, points:[p] };
  applyPenStyle(ctxI,curStroke);
  ctxI.beginPath();
  ctxI.arc(p.x,p.y,curStroke.width/2,0,Math.PI*2);
  ctxI.fill();
}
function onMove(e){
  if(!painting||!penOn||currentTool!=='pen') return;
  if(e.touches&&e.touches.length>1){ painting=false; return; }
  e.preventDefault();
  const p=getPoint(e);
  const prev=curStroke.points[curStroke.points.length-1];
  curStroke.points.push(p);
  applyPenStyle(ctxI,curStroke);
  ctxI.beginPath();
  ctxI.moveTo(prev.x,prev.y);
  ctxI.lineTo(p.x,p.y);
  ctxI.stroke();
}
function onUp(e){
  if(!painting) return;
  if(e) e.preventDefault();
  painting=false;
  if(curStroke&&curStroke.points.length) strokes.push(curStroke);
  curStroke=null;
}
inkC.addEventListener('mousedown',onDown);
inkC.addEventListener('mousemove',onMove);
inkC.addEventListener('mouseup',onUp);
inkC.addEventListener('mouseleave',onUp);
inkC.addEventListener('touchstart',onDown,{passive:false});
inkC.addEventListener('touchmove',onMove,{passive:false});
inkC.addEventListener('touchend',onUp);
inkC.addEventListener('touchcancel',onUp);

function setTool(t){
  currentTool=t;
  tDrag.classList.toggle('on',t==='drag');
  tPen.classList.toggle('on',t==='pen');
  if(t==='pen'){ penOn=true; inkC.classList.add('on'); }
  else{ penOn=false; inkC.classList.remove('on'); }
}
tDrag.addEventListener('click',()=>{ setTool('drag'); cancelErase(); hideEraseTip(); });

tPen.addEventListener('click',()=>{
  if(!stream){ toast('请先连接摄像头'); return; }
  const now=Date.now();
  setTool('pen');
  cancelErase();
  hideEraseTip();
  if(now-lastPenClick<320){ openSheet(brushSheet); }
  lastPenClick=now;
});

tUndo.addEventListener('click',()=>{
  if(!strokes.length){ toast('没有可撤销的笔迹'); return; }
  strokes.pop();
  redrawInk();

function selStartAt(cx,cy){
  selStart={cx,cy}; selecting=true;
  const r=stage.getBoundingClientRect();
  selBox.style.left=(cx-r.left)+'px';
  selBox.style.top=(cy-r.top)+'px';
  selBox.style.width='0px';
  selBox.style.height='0px';
  selBox.classList.add('show');
}
function selMoveTo(cx,cy){
  if(!selecting) return;
  const r=stage.getBoundingClientRect();
  const l=Math.min(selStart.cx,cx)-r.left;
  const t=Math.min(selStart.cy,cy)-r.top;
  selBox.style.left=l+'px';
  selBox.style.top=t+'px';
  selBox.style.width=Math.abs(cx-selStart.cx)+'px';
  selBox.style.height=Math.abs(cy-selStart.cy)+'px';
}
function selEndAt(cx,cy){
  if(!selecting) return;
  selecting=false;
  selBox.classList.remove('show');
  if(cx===undefined){ return; }
  const l=Math.min(selStart.cx,cx);
  const t=Math.min(selStart.cy,cy);
  const r=Math.max(selStart.cx,cx);
  const b=Math.max(selStart.cy,cy);
  if(r-l<6||b-t<6){ return; }

  const inkR=inkC.getBoundingClientRect();
  if(inkR.width<1) return;
  const sx=inkC.width/inkR.width;
  const sy=inkC.height/inkR.height;
  const x0=(l-inkR.left)*sx, y0=(t-inkR.top)*sy;
  const x1=(r-inkR.left)*sx, y1=(b-inkR.top)*sy;

  let affected=0;
  strokes=partialEraseByRect(strokes,x0,y0,x1,y1,()=>affected++);
  redrawInk();
  if(affected>0) toast('已擦除 '+affected+' 条笔迹，可继续框选');
}
function partialEraseByRect(list,x0,y0,x1,y1,onAffected){
  const result=[];
  list.forEach(s=>{
    let seg=null, wasAffected=false;
    const pushSeg=()=>{
      if(seg&&seg.points.length>0){
        result.push({ color:s.color, width:s.width, soft:s.soft, points:seg.points });
      }
      seg=null;
    };
    s.points.forEach(p=>{
      const inside=p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1;
      if(inside){ wasAffected=true; pushSeg(); }
      else{ if(!seg) seg={points:[]}; seg.points.push(p); }
    });
    pushSeg();
    if(wasAffected&&onAffected) onAffected();
  });
  return result;
}

function eraseAtScreenPoint(cx, cy){
  const inkR=inkC.getBoundingClientRect();
  if(inkR.width<1||inkR.height<1) return;
  const sx=inkC.width/inkR.width;
  const sy=inkC.height/inkR.height;
  const px=(cx-inkR.left)*sx;
  const py=(cy-inkR.top)*sy;
  const radius = 26 * sx;

  let changed=false;
  const newStrokes=[];
  strokes.forEach(s=>{
    let seg=null;
    const pushSeg=()=>{
      if(seg && seg.points.length>0){
        newStrokes.push({ color:s.color, width:s.width, soft:s.soft, points:seg.points });
      }
      seg=null;
    };
    s.points.forEach(p=>{
      const d=Math.hypot(p.x-px, p.y-py);
      if(d < radius){
        changed=true;
        pushSeg();
      }else{
        if(!seg) seg={points:[]};
        seg.points.push(p);
      }
    });
    pushSeg();
  });

  if(changed){
    strokes = newStrokes;
    redrawInk();
  }
}

function vPoint(e){
  const t=(e.touches&&e.touches[0])?e.touches[0]:e;
  const r=vCanvas.getBoundingClientRect();
  if(r.width<1) return {x:0,y:0};
  const sx=vCanvas.width/r.width, sy=vCanvas.height/r.height;
  return { x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy };
}
function vPenCanvasWidth(){
  const r=vCanvas.getBoundingClientRect();
  const sx=r.width>0?(vCanvas.width/r.width):DPR;
  return Math.max(1,penWidth*sx);
}
function vApplyStyle(s){
  ctxV.strokeStyle=s.color; ctxV.fillStyle=s.color;
  ctxV.lineWidth=s.w; ctxV.lineCap='round'; ctxV.lineJoin='round';
  ctxV.shadowBlur=s.soft||0; ctxV.shadowColor=s.color;
}
function vDrawStroke(s){
  if(!s.pts.length) return;
  vApplyStyle(s);
  if(s.pts.length===1){
    ctxV.beginPath();
    ctxV.arc(s.pts[0].x,s.pts[0].y,s.w/2,0,Math.PI*2);
    ctxV.fill();
    return;
  }
  ctxV.beginPath();
  ctxV.moveTo(s.pts[0].x,s.pts[0].y);
  for(let i=1;i<s.pts.length;i++) ctxV.lineTo(s.pts[i].x,s.pts[i].y);
  ctxV.stroke();
}
function redrawV(){
  ctxV.clearRect(0,0,vCanvas.width,vCanvas.height);
  vStrokes.forEach(vDrawStroke);
}
function vDown(e){
  if(!annotating) return;
  if(e.touches&&e.touches.length>1) return;
  e.preventDefault();
  vPainting=true;
  const p=vPoint(e);
  vLast=p;
  vCurStroke={pts:[p],w:vPenCanvasWidth(),color:vAnnotColor,soft:penSoft};
  vStrokes.push(vCurStroke);
  vApplyStyle(vCurStroke);
  ctxV.beginPath();
  ctxV.arc(p.x,p.y,vCurStroke.w/2,0,Math.PI*2);
  ctxV.fill();
}
function vMove(e){
  if(!vPainting||!annotating) return;
  if(e.touches&&e.touches.length>1){ vPainting=false; return; }
  e.preventDefault();
  const p=vPoint(e);
  vCurStroke.pts.push(p);
  vApplyStyle(vCurStroke);
  ctxV.beginPath();
  ctxV.moveTo(vLast.x,vLast.y);
  ctxV.lineTo(p.x,p.y);
  ctxV.stroke();
  vLast=p;
}
function vUp(e){ if(e) e.preventDefault(); vPainting=false; vCurStroke=null; }

  if(annotating) return;
  if(e.touches.length===2){
    vPinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    vScaleStart=vScale;
  }
},{passive:true});
vStage.addEventListener('touchmove',(e)=>{
  if(annotating) return;
  if(e.touches.length===2&&vPinchStart){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    vScale=clamp(vScaleStart*d/vPinchStart,0.5,5);
    applyViewer();
  }
},{passive:false});
vStage.addEventListener('touchend',()=>{ vPinchStart=0; },{passive:true});
vStage.addEventListener('wheel',(e)=>{
  if(annotating) return;
  e.preventDefault();
  vScale=clamp(vScale-e.deltaY*0.002,0.5,5);
  applyViewer();
},{passive:false});

btnDoCompare.addEventListener('click',()=>{
  if(picked.length!==2) return;
  const a=photos.find(p=>p.id===picked[0]);
  const b=photos.find(p=>p.id===picked[1]);
  if(!a||!b) return;
  cA.src=a.url; cB.src=b.url;
  closeAll();
  setTimeout(()=>cModal.classList.add('show'),180);
});
cClose.addEventListener('click',()=>cModal.classList.remove('show'));

tFull.addEventListener('click',()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>toast('全屏请求被拒绝'));
  }else{
    document.exitFullscreen();
  }
});
tStop.addEventListener('click',()=>{ stream?stopCamera():startCamera(); });
btnRetry.addEventListener('click',startCamera);

let rzTimer;
function onResize(){
  clearTimeout(rzTimer);
  rzTimer=setTimeout(()=>{ if(stream) layoutStage(); },120);
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
if(window.ResizeObserver){
  new ResizeObserver(()=>{ if(stream) layoutStage(); }).observe(stage);
}
window.addEventListener('beforeunload',()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
});

frameC.width=1280; frameC.height=720;
layoutStage();
setRunning(false);
setTool('drag');
applyTransform();
syncColorUI();

window.addEventListener('load',()=>{
  setTimeout(()=>{ if(preflight()) startCamera(); },400);
});

})();
</script>
</body>
